[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reussitess-audit"
version = "0.1.0"
description = "Audit de sécurité de projets web et Node.js : secrets exposés, permissions, injections, npm, CORS."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reussitess-audit = "reussitess_audit.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
